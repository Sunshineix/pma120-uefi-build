name: gbl-probe (EFI channel probe)

on:
  workflow_dispatch:

jobs:
  build-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout probe sources
        uses: actions/checkout@v4

      - name: Install ARM64 cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Compile GblProbe.efi
        run: |
          set -euo pipefail
          cd probe
          aarch64-linux-gnu-gcc -c -ffreestanding -fno-stack-protector \
            -fno-asynchronous-unwind-tables -fno-unwind-tables -fpic \
            -mstrict-align -g0 -O2 -Wall GblProbe.c -o GblProbe.o
          aarch64-linux-gnu-gcc -c crt0.S -o crt0.o
          aarch64-linux-gnu-ld -shared -Bsymbolic -T gblprobe.lds \
            crt0.o GblProbe.o -o GblProbe.so
          echo "--- ELF sections ---"
          aarch64-linux-gnu-readelf -S GblProbe.so | head -30
          echo "--- objcopy ---"
          aarch64-linux-gnu-objcopy -j .text -j .data -j .rodata \
            -j .dynamic -j .rela -j .reloc \
            --target=efi-app-aarch64 GblProbe.so GblProbe.efi \
            || aarch64-linux-gnu-objcopy -j .text -j .data -j .rodata \
               -j .dynamic -j .reloc \
               --target=efi-app-aarch64 GblProbe.so GblProbe.efi
          ls -la GblProbe.efi
          echo "--- PE header ---"
          xxd -l 96 GblProbe.efi
          echo "--- efi_main disassembly (verify PC-relative addressing) ---"
          aarch64-linux-gnu-objdump -d GblProbe.so | sed -n '/<efi_main>/,+70p'

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: gbl-probe
          path: probe/GblProbe.efi
