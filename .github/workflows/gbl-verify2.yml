name: gbl-verify2 (BootstrapVerify2: FD + payload)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - probe/BootstrapVerify2.S
      - .github/workflows/gbl-verify2.yml

jobs:
  build-verify2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install ARM64 cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Compile BootstrapVerify2.efi
        run: |
          set -euo pipefail
          cd probe
          ls -la
          aarch64-linux-gnu-gcc -c crt0.S -o crt0.o
          aarch64-linux-gnu-gcc -c BootstrapVerify2.S -o Verify2.o
          aarch64-linux-gnu-ld -shared -Bsymbolic -T gblprobe.lds \
            crt0.o Verify2.o -o Verify2.so
          aarch64-linux-gnu-objcopy -j .text -j .data -j .rodata \
            -j .dynamic -j .rela -j .reloc -j .fd -j .payload \
            --target=efi-app-aarch64 Verify2.so BootstrapVerify2.efi \
            || aarch64-linux-gnu-objcopy -j .text -j .data -j .rodata \
               -j .dynamic -j .reloc -j .fd -j .payload \
               --target=efi-app-aarch64 Verify2.so BootstrapVerify2.efi
          ls -la BootstrapVerify2.efi
          echo "--- PE header ---"
          xxd -l 96 BootstrapVerify2.efi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gbl-verify2
          path: probe/BootstrapVerify2.efi
