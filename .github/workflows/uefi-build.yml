# X9U-iOS绉绘椤圭洰锛歱ma120 UEFI 鍥轰欢鏋勫缓锛圡u-Silicium / uefi-sheng锛?# 鐢ㄦ硶锛氭斁鍦ㄣ€愮鏈夈€戞瀯寤轰粨搴撴牴鐩綍鐨?.github/workflows/uefi-build.yml 涓€?# 璇ョ鏈変粨搴?= uefi-sheng 鏂囦欢 + Platforms/OPPO/pma120Pkg + Resources/{Configs,DTBs}/pma120.* + Binaries/pma120锛坴endor 椹卞姩锛屼粎绉佹湁浠撳簱锛夈€?#
# 娉ㄦ剰锛氱鏈変粨搴撶敱 Contents API 閫愭枃浠朵笂浼犵粍瑁咃紝鏍戦噷娌℃湁瀛愭ā鍧?gitlink锛屾墍浠ワ細
#   - 鍏紑瀛愭ā鍧楁爲锛圡u_Basecore 绛夛級鍦ㄦ瀯寤烘椂鏄惧紡鍏嬮殕锛堟湰宸ヤ綔娴侊級锛?#   - 鍙繚鐣?workflow_dispatch 瑙﹀彂锛堜笂浼犺繃绋嬩細浜х敓涓婂崈涓?commit锛屼笉鑳芥瘡涓兘瑙﹀彂鏋勫缓锛夈€?# 璇﹁ X9U-iOS绉绘/UEFI鏋勫缓runbook.md銆?name: uefi-build (pma120)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Clone the public Mu-Silicium submodule trees (this build repo carries no gitlinks)
        run: |
          git clone -q --depth 1 --branch release/202608 https://github.com/microsoft/mu_plus.git Common/Mu
          git clone -q --depth 1 --branch release/202608 https://github.com/microsoft/mu_oem_sample.git Common/Mu_OEM_Sample
          git clone -q --depth 1 --branch release/202608 https://github.com/microsoft/mu_basecore.git Mu_Basecore
          git clone -q --depth 1 https://github.com/Project-Silicium/Silicium-ACPI.git Silicium-ACPI

          # UniXNU firmware modules (boot menu, XNU loader, FAT payload volume)
          git clone -q https://github.com/UniXNU/UniXNU.git UniXNU-src
          git -C UniXNU-src checkout -q be0e4fab0072bceaa8d744a4a6875ba5461cd7ff
          cp -r UniXNU-src/package/UniXNUPkg UniXNUPkg
          git clone -q --depth 1 https://github.com/UniXNU/DarwinBoot.git DB-src
          cp -r DB-src/DarwinBootPkg DarwinBootPkg
          mkdir -p Silicon/Silicium/OpensslPkg/Library/OpensslLib
          git init -q Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl
          git -C Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl remote add origin https://github.com/openssl/openssl.git
          git -C Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl fetch -q --depth 1 origin 67b5686b4419b4cb8caa502711c41815f5279751
          git -C Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl checkout -q FETCH_HEAD

      - name: Install host tools (setup_env.sh apt set)
        run: |
          sudo apt-get update
          sudo apt-get install -y pip git mono-devel build-essential lld uuid-dev nasm \
            gcc-aarch64-linux-gnu python3 python3-git python3-pip gettext locales gnupg \
            ca-certificates python3-venv git-core clang llvm curl

      - name: mu_nasm extdep shim (use system nasm, no Mono NuGet fetch)
        run: |
          D=Mu_Basecore/BaseTools/Bin/mu_nasm_extdep
          mkdir -p $D/Linux-x86-64
          echo 'version: 20016.1.1' > $D/extdep_state.yaml
          ln -sf /usr/bin/nasm $D/Linux-x86-64/nasm
          ln -sf /usr/bin/ndisasm $D/Linux-x86-64/ndisasm
          sudo ln -sf /usr/bin/nasm /usr/bin/ndisasm

      - name: Python requirements
        run: |
          python3 -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r pip-requirements.txt

      - name: Build UEFI firmware for pma120
        run: |
          export CLANGPDB_AARCH64_PREFIX=aarch64-linux-gnu-
          source ./venv/bin/activate
          # DEBUG锛氫笂娓告爲鐨?SEC 闃舵浠呭湪 DEBUG 鐩爣涓嬫槧灏勫甫涓插彛鏋勯€犲嚱鏁扮殑 DebugLib
          python3 build_uefi.py -d pma120 -r DEBUG -c

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp Build/pma120Pkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd artifacts/ 2>/dev/null || \
            find Build/pma120Pkg -name '*.fd' -exec cp {} artifacts/ \;
          cp Mu-pma120*.img artifacts/ 2>/dev/null || true
          cp Mu-pma120*.bin artifacts/ 2>/dev/null || true
          ls -la artifacts

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: pma120-uefi
          path: artifacts/
          retention-days: 7
