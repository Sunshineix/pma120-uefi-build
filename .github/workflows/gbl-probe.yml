name: gbl-probe (EFI channel probe)

on:
  workflow_dispatch:

jobs:
  build-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout probe sources
        uses: actions/checkout@v4

      - name: Install ARM64 cross toolchain + gnu-efi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu gnu-efi

      - name: Compile GblProbe.efi
        run: |
          set -euo pipefail
          cd probe
          aarch64-linux-gnu-gcc -c -I/usr/include/efi -I/usr/include/efi/aarch64 \
            -fPIC -ffreestanding -fno-stack-protector -fshort-wchar -mstrict-align \
            -g0 -O2 -Wall GblProbe.c -o GblProbe.o
          aarch64-linux-gnu-ld -shared -Bsymbolic -L/usr/lib \
            -T /usr/lib/gnuefi/elf_aarch64_efi.lds \
            /usr/lib/gnuefi/crt0-efi-aarch64.o GblProbe.o \
            -o GblProbe.so -lnosys -lgnuefi -lefi
          objcopy -j .text -j .sdata -j .data -j .rodata \
            -j .dynamic -j .dynsym -j .rel -j .rela -j .reloc \
            --target=efi-app-aarch64 GblProbe.so GblProbe.efi
          ls -la GblProbe.efi
          file GblProbe.efi || true

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: gbl-probe
          path: probe/GblProbe.efi
