name: gbl-probe (EFI channel probe)

on:
  workflow_dispatch:

jobs:
  build-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout probe sources
        uses: actions/checkout@v4

      - name: Install ARM64 cross toolchain + gnu-efi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu gnu-efi

      - name: Compile GblProbe.efi
        run: |
          set -euo pipefail
          cd probe
          aarch64-linux-gnu-gcc -c -ffreestanding -fno-stack-protector -fPIC \
            -mstrict-align -g0 -O2 -Wall GblProbe.c -o GblProbe.o
          CRT0=$(find /usr/lib -name crt0-efi-aarch64.o 2>/dev/null | head -1)
          LDS=$(find /usr/lib -name elf_aarch64_efi.lds 2>/dev/null | head -1)
          echo "CRT0=$CRT0"
          echo "LDS=$LDS"
          test -n "$CRT0" -a -n "$LDS"
          aarch64-linux-gnu-ld -shared -Bsymbolic -T "$LDS" "$CRT0" \
            GblProbe.o -o GblProbe.so
          objcopy -j .text -j .sdata -j .data -j .rodata \
            -j .dynamic -j .dynsym -j .rel -j .rela -j .reloc \
            --target=efi-app-aarch64 GblProbe.so GblProbe.efi
          ls -la GblProbe.efi

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: gbl-probe
          path: probe/GblProbe.efi
