name: gbl-probe (EFI channel probe)

on:
  workflow_dispatch:

jobs:
  build-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout probe sources
        uses: actions/checkout@v4

      - name: Install ARM64 cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Compile GblProbe.efi
        run: |
          set -euo pipefail
          cd probe
          aarch64-linux-gnu-gcc -c -ffreestanding -fno-stack-protector -fPIC \
            -mstrict-align -g0 -O2 -Wall GblProbe.c -o GblProbe.o
          aarch64-linux-gnu-gcc -c crt0.S -o crt0.o
          aarch64-linux-gnu-ld -shared -Bsymbolic -T gblprobe.lds \
            crt0.o GblProbe.o -o GblProbe.so
          aarch64-linux-gnu-objcopy -j .text -j .rodata -j .data \
            -j .got -j .dynamic -j .rela -j .reloc \
            --target=efi-app-aarch64 GblProbe.so GblProbe.efi
          ls -la GblProbe.efi
          echo "--- PE header check ---"
          xxd -l 96 GblProbe.efi

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: gbl-probe
          path: probe/GblProbe.efi
