name: gbl-probe (EFI channel probe)

on:
  workflow_dispatch:

jobs:
  build-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout probe sources
        uses: actions/checkout@v4

      - name: Install ARM64 cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Compile Bootstrap.efi (FD chainloader + verification)
        run: |
          set -euo pipefail
          cd probe
          ls -la
          aarch64-linux-gnu-gcc -c crt0.S -o crt0.o
          aarch64-linux-gnu-gcc -c BootstrapVerify.S -o Bootstrap.o
          aarch64-linux-gnu-ld -shared -Bsymbolic -T gblprobe.lds \
            crt0.o Bootstrap.o -o Bootstrap.so
          echo "--- ELF sections ---"
          aarch64-linux-gnu-readelf -S Bootstrap.so | head -30
          echo "--- objcopy ---"
          aarch64-linux-gnu-objcopy -j .text -j .data -j .rodata \
            -j .dynamic -j .rela -j .reloc -j .fd \
            --target=efi-app-aarch64 Bootstrap.so Bootstrap.efi \
            || aarch64-linux-gnu-objcopy -j .text -j .data -j .rodata \
               -j .dynamic -j .reloc -j .fd \
               --target=efi-app-aarch64 Bootstrap.so Bootstrap.efi
          ls -la Bootstrap.efi
          echo "--- PE header ---"
          xxd -l 96 Bootstrap.efi
          echo "--- bootstrap disasm ---"
          aarch64-linux-gnu-objdump -d Bootstrap.so | sed -n '/<efi_main>/,+40p'

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: gbl-bootstrap
          path: probe/Bootstrap.efi
